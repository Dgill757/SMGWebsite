<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMMIT OS — Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#09090a;--surface:#111112;--card:#17171a;--lift:#1e1e22;
  --b:#242428;--b2:#303035;--b3:#404046;
  --ora:#E8622A;--ora2:#FF7A40;--ora-d:rgba(232,98,42,.14);
  --grn:#3DBA74;--grn-d:rgba(61,186,116,.12);
  --amb:#F5A623;--amb-d:rgba(245,166,35,.12);
  --red:#E05252;--red-d:rgba(224,82,82,.12);
  --blu:#5B9BD5;--blu-d:rgba(91,155,213,.12);
  --pur:#9B6FD6;--pur-d:rgba(155,111,214,.12);
  --tea:#3BBFAA;--tea-d:rgba(59,191,170,.12);
  --txt:#EAEAE4;--mut:#6B6B64;--dim:#2a2a2e;--fnt:#16161a;
  font-family:'Space Grotesk',system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--txt);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* AUTH OVERLAY */
#authOverlay{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px}
.auth-box{background:var(--surface);border:1px solid var(--b);border-radius:12px;padding:40px;width:360px;text-align:center}
.auth-logo{font-family:'Syne',sans-serif;font-weight:800;font-size:28px;margin-bottom:8px}
.auth-logo span{color:var(--ora)}
.auth-sub{font-size:13px;color:var(--mut);margin-bottom:24px}
.auth-input{width:100%;background:var(--card);border:1px solid var(--b);border-radius:6px;padding:12px;color:var(--txt);font-size:14px;font-family:'JetBrains Mono',monospace;outline:none;text-align:center;letter-spacing:3px}
.auth-input:focus{border-color:var(--ora)}
.auth-btn{width:100%;margin-top:12px;background:var(--ora);border:none;border-radius:6px;padding:12px;color:#000;font-size:14px;font-weight:700;cursor:pointer;font-family:'Space Grotesk',sans-serif}
.auth-err{font-size:12px;color:var(--red);margin-top:8px;display:none}

/* TOPBAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--b);padding:0 20px;height:46px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;gap:12px}
.logo{display:flex;align-items:center;gap:8px;font-family:'Syne',sans-serif;font-weight:800;font-size:15px;letter-spacing:.04em;white-space:nowrap}
.logo-sq{width:24px;height:24px;background:var(--ora);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#000;font-family:'JetBrains Mono',monospace;flex-shrink:0}
.logo span{color:var(--ora)}
.nav-tabs{display:flex;gap:4px;flex:1;justify-content:center}
.nav-tab{background:var(--card);border:1px solid var(--b);border-radius:4px;padding:4px 12px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--mut);cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:5px;white-space:nowrap}
.nav-tab .dot{width:5px;height:5px;border-radius:50%;background:var(--mut)}
.nav-tab.active{border-color:var(--ora);color:var(--txt);background:var(--ora-d)}
.nav-tab.active .dot,.nav-tab.live .dot{background:var(--grn);animation:blink 2s infinite}
.nav-tab:hover:not(.active){border-color:var(--b2);color:var(--txt)}
.topbar-right{display:flex;align-items:center;gap:8px;font-size:11px;font-family:'JetBrains Mono',monospace;white-space:nowrap}
#sysStatus{color:var(--grn)}
#clock{color:var(--mut);font-size:10px}
.idle-badge{background:var(--dim);padding:3px 8px;border-radius:3px;font-size:10px;letter-spacing:.08em;color:var(--mut)}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}

/* LAYOUT */
.body{display:flex;flex:1;overflow:hidden}
.main{flex:1;overflow-y:auto;padding:18px 20px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.sidebar{width:272px;min-width:272px;border-left:1px solid var(--b);background:var(--surface);overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.main::-webkit-scrollbar,.sidebar::-webkit-scrollbar{width:3px}
.main::-webkit-scrollbar-thumb,.sidebar::-webkit-scrollbar-thumb{background:var(--b2)}

/* KPI BAR */
.kpi-row{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:16px}
.kpi{background:var(--card);border:1px solid var(--b);border-radius:7px;padding:10px 12px;cursor:pointer;transition:all .2s}
.kpi:hover{border-color:var(--b2)}
.kpi-label{font-size:9px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center}
.kpi-val{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-.03em}
.kpi-delta{font-size:9px;font-family:'JetBrains Mono',monospace;margin-top:2px}

/* SECTION LABEL */
.sec{font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--mut);text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sec::after{content:'';flex:1;height:1px;background:var(--b)}
.sec-action{font-size:9px;color:var(--ora);cursor:pointer;letter-spacing:.06em;flex-shrink:0}
.sec-action:hover{color:var(--ora2)}

/* PIPELINE */
.pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:0;margin-bottom:16px}
.pl{border:1px solid var(--b);border-right:none;text-align:center;padding:10px 6px;cursor:pointer;transition:all .15s;position:relative}
.pl:first-child{border-radius:5px 0 0 5px}
.pl:last-child{border-right:1px solid var(--b);border-radius:0 5px 5px 0}
.pl:hover{background:var(--lift)}
.pl-l{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--mut);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:4px}
.pl-n{font-size:22px;font-weight:700;font-family:'JetBrains Mono',monospace}
.pl.active-stage{background:var(--ora-d);border-color:var(--ora)}

/* MRR */
.mrr-card{background:var(--card);border:1px solid var(--b);border-radius:7px;padding:14px;margin-bottom:16px}
.mrr-top{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.mrr-big{font-size:36px;font-weight:700;font-family:'JetBrains Mono',monospace;color:var(--ora);letter-spacing:-.03em}
.mrr-of{font-size:13px;color:var(--mut)}
.mrr-track{height:5px;background:var(--dim);border-radius:3px;overflow:hidden;margin-bottom:6px}
.mrr-fill{height:100%;background:linear-gradient(90deg,var(--ora),var(--amb));border-radius:3px;transition:width .8s}
.mrr-milestones{display:flex;justify-content:space-between;font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--mut)}
.mrr-sub{font-size:11px;color:var(--mut);margin-top:6px;line-height:1.6}

/* AGENT FLEET */
.agent-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:16px}
.agent{background:var(--card);border:1px solid var(--b);border-radius:6px;padding:10px 12px;cursor:pointer;transition:all .15s;display:flex;align-items:center;gap:10px}
.agent:hover{border-color:var(--b2);background:var(--lift)}
.agent-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.agent-dot.run{background:var(--grn);animation:blink .8s infinite}
.agent-dot.idle{background:var(--mut)}
.agent-dot.err{background:var(--red);animation:blink .4s infinite}
.agent-dot.sched{background:var(--amb)}
.agent-info{flex:1;min-width:0}
.agent-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.agent-meta{font-size:9px;color:var(--mut);font-family:'JetBrains Mono',monospace;display:flex;gap:8px;margin-top:2px}
.agent-badge{font-size:8px;font-family:'JetBrains Mono',monospace;padding:2px 6px;border-radius:3px;flex-shrink:0}

/* COMMAND RUNNER */
.cmd-card{background:var(--fnt);border:1px solid var(--b);border-radius:7px;overflow:hidden;margin-bottom:16px}
.cmd-header{background:var(--card);border-bottom:1px solid var(--b);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.cmd-title{font-size:13px;font-weight:600}
.cmd-title .kw{color:var(--ora)}
.cmd-status{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--mut);display:flex;align-items:center;gap:6px}
.cmd-body{padding:12px 14px}
.cmd-input{width:100%;background:var(--card);border:1px solid var(--b);border-radius:5px;padding:10px 12px;color:var(--txt);font-size:13px;font-family:'Space Grotesk',sans-serif;outline:none;resize:none;height:68px;transition:border-color .2s}
.cmd-input:focus{border-color:var(--ora)}
.cmd-input::placeholder{color:var(--mut)}
.btn-row{display:flex;gap:8px;margin-top:8px}
.btn-run{background:var(--ora);border:none;border-radius:5px;padding:9px 20px;color:#000;font-size:13px;font-weight:700;cursor:pointer;flex:1;font-family:'Space Grotesk',sans-serif;transition:background .15s}
.btn-run:hover{background:var(--ora2)}
.btn-run:disabled{opacity:.4;cursor:not-allowed}
.btn-sec{background:transparent;border:1px solid var(--b);border-radius:5px;padding:9px 14px;color:var(--mut);font-size:12px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .15s}
.btn-sec:hover{border-color:var(--b2);color:var(--txt)}
.cmd-output{background:var(--bg);border:1px solid var(--b);border-radius:4px;padding:10px 12px;font-family:'JetBrains Mono',monospace;font-size:11px;min-height:60px;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.6;margin-top:8px;display:none}
.cmd-output.show{display:block}
.ol-g{color:var(--grn)}.ol-o{color:var(--ora)}.ol-b{color:var(--blu)}.ol-r{color:var(--red)}.ol-m{color:var(--mut)}

/* QUICK COMMANDS — ALL WORKING */
.qcmd-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:16px}
.qcmd{background:var(--card);border:1px solid var(--b);border-radius:5px;padding:10px;cursor:pointer;transition:all .15s;text-align:center}
.qcmd:hover{border-color:var(--ora);background:var(--ora-d)}
.qcmd-icon{font-size:18px;margin-bottom:4px}
.qcmd-label{font-size:11px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:.04em}
.qcmd-sub{font-size:9px;color:var(--mut);margin-top:2px}

/* DOMAIN SKILLS */
.domain-sec{margin-bottom:16px}
.domain-lbl{font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--mut);text-transform:uppercase;margin-bottom:6px;display:flex;align-items:center;gap:6px}
.domain-lbl::after{content:'';flex:1;height:1px;background:var(--b)}
.skill-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.sk{background:var(--card);border:1px solid var(--b);border-radius:4px;padding:8px 8px;font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--txt);cursor:pointer;transition:all .15s;text-align:left;line-height:1.3}
.sk:hover{border-color:var(--ora);color:var(--ora);background:var(--ora-d)}
.sk.loaded{border-color:var(--ora);color:var(--ora);background:var(--ora-d)}
.sk-type{font-size:7px;color:var(--mut);display:block;margin-bottom:2px;letter-spacing:.08em}
.sk[data-type="routine"] .sk-type{color:var(--amb)}
.sk[data-type="auto"] .sk-type{color:var(--grn)}
.sk[data-type="agent"] .sk-type{color:var(--pur)}

/* SIDEBAR CARDS */
.sb-card{background:var(--card);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:10px}
.sb-title{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--mut);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.stat-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--dim);font-size:11px}
.stat-row:last-child{border:none}
.stat-lbl{color:var(--mut)}
.stat-val{font-family:'JetBrains Mono',monospace;font-weight:500}
.run-item{display:flex;gap:6px;padding:5px 0;border-bottom:1px solid var(--dim);font-size:10px;align-items:flex-start;cursor:pointer;transition:opacity .15s}
.run-item:hover{opacity:.7}
.run-item:last-child{border:none}
.run-badge{font-size:8px;font-family:'JetBrains Mono',monospace;padding:2px 5px;border-radius:2px;flex-shrink:0;margin-top:1px}
.rb-cre{background:var(--grn-d);color:var(--grn)}
.rb-upd{background:var(--blu-d);color:var(--blu)}
.run-info{flex:1;min-width:0}
.run-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--txt)}
.run-path{font-family:'JetBrains Mono',monospace;font-size:8px;color:var(--mut);display:block;margin-top:1px}
.run-time{font-size:8px;color:var(--dim);font-family:'JetBrains Mono',monospace;flex-shrink:0}
.mini-bar{display:flex;align-items:flex-end;gap:2px;height:36px;margin-top:6px}
.mb-bar{flex:1;background:var(--ora);border-radius:2px 2px 0 0;opacity:.7;min-height:2px}
.mb-bar:last-child{opacity:1}
.mb-labels{display:flex;justify-content:space-between;font-size:8px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:2px}
.forecast-bar{height:5px;background:var(--dim);border-radius:3px;overflow:hidden;margin:6px 0}
.fb-fill{height:100%;background:var(--ora);border-radius:3px}

/* HISTORY PANEL */
.history-panel{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;display:flex;justify-content:flex-end;opacity:0;pointer-events:none;transition:opacity .2s}
.history-panel.show{opacity:1;pointer-events:all}
.hp-inner{background:var(--surface);border-left:1px solid var(--b);width:520px;height:100%;overflow-y:auto;padding:20px}
.hp-close{cursor:pointer;font-size:20px;color:var(--mut);float:right;line-height:1}
.hp-title{font-family:'Syne',sans-serif;font-size:18px;font-weight:800;margin-bottom:4px}
.hp-sub{font-size:11px;color:var(--mut);margin-bottom:20px}
.hp-entry{background:var(--card);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:8px}
.hp-date{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--mut);margin-bottom:4px}
.hp-body{font-size:12px;line-height:1.6;color:var(--txt)}
.hp-meta{display:flex;gap:8px;margin-top:8px}
.hp-tag{font-size:9px;font-family:'JetBrains Mono',monospace;padding:2px 7px;border-radius:3px;background:var(--lift);color:var(--mut)}

/* REPLY FEED */
.reply-item{background:var(--card);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:6px;cursor:pointer;transition:all .2s}
.reply-item:hover{border-color:var(--b2)}
.reply-item.hot{border-color:var(--ora);background:var(--ora-d)}
.ri-top{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.ri-name{font-size:13px;font-weight:600;flex:1}
.ri-time{font-size:10px;color:var(--mut);font-family:'JetBrains Mono',monospace}
.ri-badge{font-size:9px;padding:2px 7px;border-radius:3px;font-family:'JetBrains Mono',monospace}
.rb-pos{background:var(--grn-d);color:var(--grn)}
.rb-neg{background:var(--red-d);color:var(--red)}
.rb-neu{background:var(--dim);color:var(--mut)}
.ri-company{font-size:11px;color:var(--mut);margin-bottom:6px;font-family:'JetBrains Mono',monospace}
.ri-msg{font-size:12px;color:var(--txt);line-height:1.5;border-left:2px solid var(--b2);padding-left:8px}
.ri-actions{display:flex;gap:6px;margin-top:8px}
.ri-btn{background:var(--ora);border:none;border-radius:4px;padding:5px 12px;font-size:11px;font-weight:600;color:#000;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:background .15s}
.ri-btn:hover{background:var(--ora2)}
.ri-btn.sec{background:var(--lift);color:var(--txt);border:1px solid var(--b)}

/* SPINNER */
.spin{width:12px;height:12px;border:1.5px solid var(--b2);border-top-color:var(--ora);border-radius:50%;animation:sp .6s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}

/* TOAST */
#toastC{position:fixed;bottom:20px;right:20px;z-index:500;display:flex;flex-direction:column;gap:6px}
.toast{background:var(--card);border:1px solid var(--b);border-left:3px solid var(--ora);border-radius:6px;padding:10px 14px;font-size:12px;animation:tin .25s;box-shadow:0 8px 24px rgba(0,0,0,.6);max-width:320px}
.toast.err{border-left-color:var(--red)}
.toast.ok{border-left-color:var(--grn)}
@keyframes tin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

/* DEMO PROGRESS */
.demo-progress{background:var(--card);border:1px solid var(--b);border-radius:7px;padding:14px;margin-bottom:16px}
.dp-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.dp-steps{display:flex;flex-direction:column;gap:4px}
.dp-step{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:11px;opacity:.3;transition:opacity .3s}
.dp-step.done{opacity:1}
.dp-step.active{opacity:1;color:var(--ora)}
.dp-icon{width:18px;height:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:9px;background:var(--dim);flex-shrink:0}
.dp-step.done .dp-icon{background:var(--grn-d);color:var(--grn)}
.dp-step.active .dp-icon{background:var(--ora-d);color:var(--ora)}
.dp-track{height:3px;background:var(--dim);border-radius:2px;overflow:hidden;margin-top:8px}
.dp-fill{height:100%;background:var(--ora);border-radius:2px;transition:width .4s}

/* ANALYTICS GRID */
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.an-card{background:var(--card);border:1px solid var(--b);border-radius:7px;padding:14px}
.an-title{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--mut);letter-spacing:.08em;text-transform:uppercase;margin-bottom:10px}
.funnel-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.funnel-lbl{font-size:11px;width:80px;flex-shrink:0}
.funnel-bar-wrap{flex:1;height:14px;background:var(--dim);border-radius:2px;overflow:hidden;cursor:help}
.funnel-bar{height:100%;border-radius:2px;transition:width .6s}
.funnel-pct{font-size:10px;font-family:'JetBrains Mono',monospace;width:36px;text-align:right;color:var(--mut)}
.chart-wrap{height:80px;display:flex;align-items:flex-end;gap:3px;padding-top:8px}
.c-bar{flex:1;border-radius:2px 2px 0 0;transition:height .5s;min-height:2px;cursor:default}
.c-bar:last-child{background:var(--ora)!important}
.c-labels{display:flex;justify-content:space-between;font-size:8px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:3px}

/* CONTENT CALENDAR */
.content-row{display:flex;gap:8px;padding:8px 0;border-bottom:1px solid var(--dim)}
.content-row:last-child{border:none}
.cont-platform{font-size:10px;font-family:'JetBrains Mono',monospace;width:70px;flex-shrink:0;color:var(--ora)}
.cont-status{width:6px;height:6px;border-radius:50%;flex-shrink:0;margin-top:4px}
.cont-text{font-size:11px;color:var(--txt);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cont-time{font-size:9px;color:var(--mut);font-family:'JetBrains Mono',monospace;flex-shrink:0}

/* SCROLLBAR */
::-webkit-scrollbar{width:3px;height:3px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}
</style>
</head>
<body>

<!-- AUTH -->
<div id="authOverlay">
  <div class="auth-box">
    <div class="auth-logo">SUMMIT<span>OS</span></div>
    <div class="auth-sub">Enter access code: ava2026</div>
    <input class="auth-input" id="authInput" type="password" placeholder="••••••••••" maxlength="20">
    <div class="auth-err" id="authErr">Incorrect code</div>
    <button class="auth-btn" id="authBtn">ENTER →</button>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="logo"><div class="logo-sq">S</div>SUMMIT<span>OS</span></div>
    <div class="nav-tabs">
      <div class="nav-tab live active" data-page="brief"><span class="dot"></span>BRIEF</div>
      <div class="nav-tab" data-page="agents"><span class="dot" style="background:var(--b2)"></span>AGENTS</div>
      <div class="nav-tab" data-page="leads"><span class="dot" style="background:var(--b2)"></span>LEADS</div>
      <div class="nav-tab" data-page="demos"><span class="dot" style="background:var(--b2)"></span>DEMOS</div>

async function api(path,opts={}){
  try{
    const r=await fetch(API+path,{
      headers:{'Content-Type':'application/json','X-API-Key':KEY,...(opts.headers||{})},
      ...opts
    });
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    return await r.json();
  }catch(e){return null;}
}

async function executeCommand(cmd,label){
  if(running)return toast('Agent running — wait for completion','err');
  running=true;
  setIdle(false,label||'Running...');
  showOutput();
  outputLines=[];

  addLine('o',`> ${cmd}`);

  const lower=cmd.toLowerCase().trim();

  // ROUTE COMMAND
  try{
    if(lower.startsWith('build')||lower.startsWith('demo ')){
      const url=cmd.split(' ').find(w=>w.includes('.')||w.match(/^https?/));
      if(url){await runDemoBuild(url);}
      else{toast('Provide a website URL: build peakroofing.com','err');}

    } else if(lower==='morning brief'||lower.startsWith('brief')){
      await runMorningBrief();

    } else if(lower==='hot leads'||lower.includes('hot lead')){
      await runHotLeads();

    } else if(lower==='pipeline'||lower.startsWith('pipeline')){
      await runPipelineSnapshot();

    } else if(lower.startsWith('content')||lower==='content'){
      await runContentGen();

    } else if(lower.startsWith('audit')){
      const url=cmd.split(' ').slice(1).join(' ').trim();
      if(url){await runAudit(url);}
      else{toast('Provide a URL: audit peakroofing.com','err');}

    } else if(lower.startsWith('scrape')){
      const city=cmd.split(' ').slice(1).join(' ').trim();
      await runScrape(city||D.leadsCity);

    } else if(lower==='status'||lower==='/status'){
      await runStatus();

    } else if(lower.startsWith('meeting prep')||lower.startsWith('prep ')){
      const name=cmd.split(' ').slice(2).join(' ');
      await runMeetingPrep(name);

    } else if(lower.startsWith('research')){
      await runResearch();

    } else {
      // Generic dispatch to Railway
      if(apiOk){
        const r=await api('/dispatch',{method:'POST',body:JSON.stringify({command:lower,url:cmd.split(' ')[1]||''})});
        addLine('b',`→ ${r?JSON.stringify(r):'Command dispatched'}`);
      } else {
        addLine('m',`→ [demo mode] ${cmd}`);
        addLine('m','  Connect Railway to execute live commands');
      }
    }
  }catch(e){
    addLine('r',`✗ Error: ${e.message}`);
  }

  running=false;
  setIdle(true);
  render();
}

async function runDemoBuild(url){
  buildActive=true; buildStep=0; buildDone=[];
  setIdle(false,'Demo Machine');
  page='demos';
  render();

  const dur=[1200,900,800,1100,1300,900,1400,700,600,600];
  let demoId=null;

  // Start real API call
  if(apiOk){
    api('/demos/create',{method:'POST',body:JSON.stringify({website_url:url.startsWith('http')?url:'https://'+url,client_name:'Demo Prospect',send_delivery:false})})
      .then(r=>{if(r)demoId=r.demo_id||r.id;});
  }

  for(let i=0;i<BUILD_STEPS.length;i++){
    buildStep=i; buildDone.push(i);
    addLine('o',`Step ${i+1}/10: ${BUILD_STEPS[i]}`);
    render();
    await new Promise(res=>setTimeout(res,dur[i]));
  }

  buildActive=false;
  addLine('g','✓ Demo complete!');

  // Poll for real URL if API called
  if(demoId&&apiOk){
    let attempts=0;
    const poll=async()=>{
      const s=await api(`/demos/${demoId}/status`);
      if(s&&s.demo_url){
        addLine('g',`✓ LIVE: ${s.demo_url}`);
        toast('Demo live: '+s.demo_url,'ok');
      } else if(++attempts<10){
        setTimeout(poll,5000);
      }
    };
    setTimeout(poll,3000);
  } else {
    const slug=url.replace(/[^a-z0-9]/gi,'-').toLowerCase().slice(0,20);
    addLine('g',`Demo URL: summit-demo-${slug}.vercel.app`);
    toast('Demo built!','ok');
  }

  setIdle(true);
  render();
}

function addLine(type,text){
  outputLines.push({type,text});
  const o=document.getElementById('cmdOut');
  if(o){
    o.classList.add('show');
    const sp=document.createElement('span');
    sp.className=`ol-${type}`;
    sp.textContent=text+'\n';
    o.appendChild(sp);
    o.scrollTop=o.scrollHeight;
  }
}

function openHistory(title,sub,entries){
  const panel=document.getElementById('historyPanel');
  document.getElementById('histTitle').textContent=title;
  document.getElementById('histSub').textContent=sub;
  const c=document.getElementById('histContent');
  c.innerHTML='';
  if(!entries||!entries.length){
    c.innerHTML='<div style="color:var(--mut);font-size:12px;padding:20px 0">No history yet — data populates as agents run.</div>';
  } else {
    entries.forEach(e=>{
      const div=document.createElement('div');
      div.className='hp-entry';
      div.innerHTML=`<div class="hp-date">${e.date||''}</div><div class="hp-body">${e.body||e.text||''}</div><div class="hp-meta">${(e.tags||[]).map(t=>`<span class="hp-tag">${t}</span>`).join('')}</div>`;
      c.appendChild(div);
    });
  }
  panel.classList.add('show');
}

function closeHistory(){document.getElementById('historyPanel').classList.remove('show');}

function renderAgents(){
  const liveMap={};
  (D.liveAgents||[]).forEach(a=>liveMap[a.agent_id]=a);

  const deptOrder=['SALES','DEMOS','MARKETING','CLIENTS','OPS'];
  const deptColors={SALES:'var(--ora)',DEMOS:'var(--blu)',MARKETING:'var(--pur)',CLIENTS:'var(--grn)',OPS:'var(--tea)'};
  const deptIcons={SALES:'\uD83C\uDFAF',DEMOS:'\uD83D\uDDA5',MARKETING:'\uD83D\uDCE2',CLIENTS:'\uD83E\uDD1D',OPS:'\u2699\uFE0F'};

  const byTier={};
  D.agents.forEach(a=>{
    const tier=a.tier||'OPS';
    if(!byTier[tier])byTier[tier]=[];
    const live=liveMap[a.id];
    const merged=live?{...a,
      status:live.status==='ok'?'ok':live.status==='error'||live.status==='blocked'?'err':'idle',
      output:live.output_summary||a.output,
      lastRun:live.last_run?new Date(live.last_run).toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}):a.lastRun,
      next:live.next_run||a.next
    }:a;
    byTier[tier].push(merged);
  });

  const allA=D.agents;
  const totOk=allA.filter(a=>a.status==='ok').length;
  const totErr=allA.filter(a=>a.status==='err'||a.status==='error'||a.status==='blocked').length;
  const totIdle=allA.filter(a=>a.status==='idle').length;
  const blockers=(D.liveAgents||[]).flatMap(a=>a.blockers||[]);

  const summary=`<div style="background:var(--card);border:1px solid var(--b);border-radius:8px;padding:14px 16px;margin-bottom:14px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px">
    <div style="font-size:13px;font-weight:600">Summit Voice AI — AI Company (${allA.length} Employees)</div>
    <div style="font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--mut)">CEO VIEW — Live from Railway API</div>
  </div>
  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px">
    <div style="background:var(--grn-d);border:1px solid var(--grn);border-radius:5px;padding:10px;text-align:center">
      <div style="font-size:22px;font-weight:700;color:var(--grn);font-family:JetBrains Mono,monospace">${totOk}</div>
      <div style="font-size:9px;color:var(--grn);letter-spacing:.1em">RUNNING</div>
    </div>
    <div style="background:var(--amb-d);border:1px solid var(--amb);border-radius:5px;padding:10px;text-align:center">
      <div style="font-size:22px;font-weight:700;color:var(--amb);font-family:JetBrains Mono,monospace">${totIdle}</div>
      <div style="font-size:9px;color:var(--amb);letter-spacing:.1em">IDLE/SCHED</div>
    </div>
    <div style="background:var(--red-d);border:1px solid var(--red);border-radius:5px;padding:10px;text-align:center">
      <div style="font-size:22px;font-weight:700;color:var(--red);font-family:JetBrains Mono,monospace">${totErr}</div>
      <div style="font-size:9px;color:var(--red);letter-spacing:.1em">BLOCKED</div>
    </div>
  </div>
  ${blockers.length>0?`<div style="padding:8px 10px;background:var(--red-d);border:1px solid var(--red);border-radius:5px;font-size:11px;color:var(--red)">\u26A0 BLOCKERS: ${blockers.slice(0,3).join(' | ')}</div>`:''}
</div>`;

  const depts=deptOrder.filter(d=>byTier[d]);
  const deptSections=depts.map(tier=>{
    const agents=byTier[tier]||[];
    const col=deptColors[tier]||'var(--ora)';
    const icon=deptIcons[tier]||'\uD83E\uDD16';
    const okCount=agents.filter(a=>a.status==='ok').length;
    return `<div style="margin-bottom:16px">
  <div style="display:flex;align-items:center;justify-content:space-between;margin:12px 0 8px">
    <div style="font-size:10px;font-family:JetBrains Mono,monospace;letter-spacing:.12em;color:var(--mut);text-transform:uppercase">${icon} ${tier} DEPARTMENT</div>
    <div style="font-size:9px;font-family:JetBrains Mono,monospace;color:${col}">${okCount}/${agents.length} ACTIVE</div>
  </div>
  <div class="agent-grid">
    ${agents.map(a=>{
      const sOk=a.status==='ok';
      const sErr=a.status==='err'||a.status==='error'||a.status==='blocked';
      const sBadge=sOk?'var(--grn-d);color:var(--grn)':sErr?'var(--red-d);color:var(--red)':'var(--dim);color:var(--mut)';
      const sLabel=sOk?'OK':sErr?'BLOCKED':'IDLE';
      const sDot=sOk?'run':sErr?'err':'idle';
      const outShort=(a.output||'No output yet').slice(0,90);
      const safeName=a.name.replace(/'/g,"\\'");
      const safeOut=outShort.replace(/'/g,"\\\'");
      const safeLast=(a.lastRun||'never').replace(/'/g,"\\\'");
      return `<div class="agent" onclick="openHistory('${safeName}','Latest output',[{date:'${safeLast}',body:'${safeOut}',tags:['${tier}','${sLabel}']}])">
        <div class="agent-dot ${sDot}"></div>
        <div class="agent-info" style="min-width:0">
          <div class="agent-name">${a.name}</div>
          <div class="agent-meta">
            <span>Last: ${a.lastRun||'never'}</span>
            <span>Next: ${a.next||'on demand'}</span>
          </div>
          <div style="font-size:10px;color:var(--mut);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${outShort}</div>
        </div>
        <div class="agent-badge" style="background:${sBadge};flex-shrink:0">${sLabel}</div>
      </div>`;
    }).join('')}
  </div>
</div>`;
  }).join('');

  return summary+deptSections;
}

// ═══════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function loadSkill(name,type){
  activeSkill=name;
  const prompt=getSkillPrompt(name);
  render();
  setTimeout(()=>{
    const i=document.getElementById('cmdInput');
    if(i){i.value=prompt;i.focus();}
  },50);
  toast(`Loaded: ${name}`);
}

const SKILL_PROMPTS={
  'Build Demo':'build [website URL]',
  'Morning Brief':'morning brief',
  'Apollo Scrape':'scrape [city, state]',
  'Reply Monitor':'hot leads',
  'Pipeline Snapshot':'pipeline',
  'Marketing Audit':'audit [website URL]',
  'Weekly Content':'content',
  'Daily Brief':'morning brief',
  'CEO Report':'CEO weekly report — analyze this week\'s pipeline numbers',
  'Meeting Prep':'meeting prep [contact name or company]',
  'Research':'research voice AI roofing industry news',
  'Status':'/status',
};
function getSkillPrompt(name){return SKILL_PROMPTS[name]||name.toLowerCase();}

function runFromInput(){
  const i=document.getElementById('cmdInput');
  const cmd=i?i.value.trim():'';
  if(cmd)executeCommand(cmd,activeSkill||'Command');
}

function toast(msg,type=''){
  const c=document.getElementById('toastC');
  const el=document.createElement('div');
  el.className='toast'+( type==='err'?' err':type==='ok'?' ok':'');
  el.textContent=msg;
  c.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';el.style.transition='opacity .3s';setTimeout(()=>el.remove(),400);},4000);
}

// ═══════════════════════════════════════════════════════
// NAVIGATION + RENDER
// ═══════════════════════════════════════════════════════
function nav(p){
  page=p;
  document.querySelectorAll('.nav-tab').forEach(t=>{
    t.classList.toggle('active',t.dataset.page===p);
  });
  render();
}

function render(){
  const renders={brief:renderBrief,agents:renderAgents,leads:renderLeads,demos:renderDemos,analytics:renderAnalytics,content:renderContent,vault:renderVault,skills:renderSkills};
  const mc=document.getElementById('mainContent');
  const sb=document.getElementById('sidebarContent');
  if(mc)mc.innerHTML=(renders[page]||renderBrief)();
  if(sb)sb.innerHTML=renderSidebar();
}

// ═══════════════════════════════════════════════════════
// KEYBOARD + EVENTS
// ═══════════════════════════════════════════════════════
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key==='k'){
    e.preventDefault();
    const i=document.getElementById('cmdInput');
    if(i){i.focus();i.select();}
  }
  if(e.key==='Escape'){closeHistory();clearCmd();}
});

document.querySelectorAll('.nav-tab').forEach(t=>{
  t.addEventListener('click',()=>nav(t.dataset.page));
});

// Clock
setInterval(()=>{
  const el=document.getElementById('clock');
  if(el)el.textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
},1000);

// ═══════════════════════════════════════════════════════
async function init(){
  render();
  await refreshLiveData();
  render();
  setInterval(async()=>{await refreshLiveData();render();},30000);

}
