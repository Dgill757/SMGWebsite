display_information:
  name: SummitOS Jarvis
  description: Secure SummitOS briefings and conversations with Jarvis.
  background_color: "#07101f"
features:
  bot_user:
    display_name: SummitOS Jarvis
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - incoming-webhook
settings:
  event_subscriptions:
    request_url: https://ava-studio-api-production.up.railway.app/jarvis/slack/events
    bot_events:
      - app_mention
      - message.channels
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
