<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SUMMIT OS — Dan Gill III</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@300;400;500;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a08;--surface:#111110;--card:#171715;--lift:#1e1e1b;
  --b:#2a2a27;--b2:#363632;--b3:#454540;
  --orange:#E8622A;--orange2:#FF7A40;--orange-dim:rgba(232,98,42,.15);
  --amber:#F5A623;--amber-dim:rgba(245,166,35,.12);
  --green:#4CAF7D;--green-dim:rgba(76,175,125,.12);
  --red:#E05252;--red-dim:rgba(224,82,82,.12);
  --blue:#5B9BD5;--blue-dim:rgba(91,155,213,.12);
  --purple:#9B6FD6;--purple-dim:rgba(155,111,214,.12);
  --teal:#3BBFAA;--teal-dim:rgba(59,191,170,.12);
  --text:#E8E8E2;--muted:#6B6B64;--dim:#333330;--faint:#1a1a17;
  font-family:'Space Grotesk',system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--text);overflow:hidden}
.app{display:flex;flex-direction:column;height:100vh}

/* TOP BAR */
.topbar{background:var(--surface);border-bottom:1px solid var(--b);padding:0 24px;height:48px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{display:flex;align-items:center;gap:10px;font-family:'Syne',sans-serif;font-weight:800;font-size:16px;letter-spacing:.05em}
.logo-icon{width:26px;height:26px;background:var(--orange);border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:800;color:#000;font-family:'JetBrains Mono',monospace}
.logo span{color:var(--orange)}
.topbar-center{display:flex;gap:6px}
.tb-pill{background:var(--card);border:1px solid var(--b);border-radius:4px;padding:3px 10px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:5px}
.tb-pill:hover{border-color:var(--b2);color:var(--text)}
.tb-pill .dot{width:6px;height:6px;border-radius:50%}
.tb-pill.live .dot{background:var(--green);animation:blink 2s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}
.tb-right{display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.idle-badge{background:var(--dim);padding:3px 8px;border-radius:3px;font-size:10px;letter-spacing:.1em}

/* MAIN LAYOUT */
.main{display:flex;flex:1;overflow:hidden}

/* CONTENT AREA */
.content{flex:1;overflow-y:auto;padding:20px 24px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.content::-webkit-scrollbar{width:4px}
.content::-webkit-scrollbar-thumb{background:var(--b2)}

/* RIGHT PANEL */
.right-panel{width:280px;min-width:280px;border-left:1px solid var(--b);background:var(--surface);overflow-y:auto;padding:16px;scrollbar-width:thin;scrollbar-color:var(--b) transparent}
.right-panel::-webkit-scrollbar{width:3px}
.right-panel::-webkit-scrollbar-thumb{background:var(--b2)}

/* SECTION HEADERS */
.sect{font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin:16px 0 8px;display:flex;align-items:center;gap:8px}
.sect::after{content:'';flex:1;height:1px;background:var(--b)}

/* USAGE WINDOWS */
.windows{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px}
.window-card{background:var(--card);border:1px solid var(--b);border-radius:6px;padding:10px 12px}
.wc-label{font-size:9px;font-family:'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}
.wc-bar{height:5px;background:var(--dim);border-radius:2px;overflow:hidden;margin-bottom:6px}
.wc-fill{height:100%;border-radius:2px;transition:width .5s}
.wc-stats{display:flex;justify-content:space-between;align-items:baseline}
.wc-main{font-size:18px;font-weight:600;font-family:'JetBrains Mono',monospace;letter-spacing:-.02em}
.wc-sub{font-size:9px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.wc-tag{font-size:9px;font-family:'JetBrains Mono',monospace;background:var(--dim);padding:1px 5px;border-radius:2px;color:var(--muted)}

/* ACTIVITY CHART */
.activity-card{background:var(--card);border:1px solid var(--b);border-radius:6px;padding:14px;margin-bottom:12px}
.ac-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ac-title{font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.06em}
.ac-stat{font-size:10px;font-family:'JetBrains Mono',monospace;color:var(--orange)}
.chart-area{height:64px;display:flex;align-items:flex-end;gap:2px;position:relative}
.chart-bar{flex:1;border-radius:2px 2px 0 0;transition:height .5s;cursor:default}
.chart-bar:hover{opacity:.8}
.chart-labels{display:flex;justify-content:space-between;margin-top:4px}
.chart-label{font-size:9px;color:var(--dim);font-family:'JetBrains Mono',monospace}

/* INTEGRATIONS */
.int-row{display:flex;gap:6px;margin-bottom:12px}
.int-pill{background:var(--faint);border:1px solid var(--b);border-radius:3px;padding:3px 8px;font-size:9px;font-family:'JetBrains Mono',monospace;display:flex;align-items:center;gap:4px;color:var(--muted)}
.int-pill .dot{width:5px;height:5px;border-radius:50%}

/* SKILL RUNNER */
.runner-card{background:var(--faint);border:1px solid var(--b);border-radius:6px;overflow:hidden;margin-bottom:16px}
.runner-status{background:var(--card);border-bottom:1px solid var(--b);padding:10px 14px;display:flex;align-items:center;justify-content:space-between}
.runner-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px}
.runner-title .kw{color:var(--orange)}
.runner-sub{font-size:10px;color:var(--muted);font-family:'JetBrains Mono',monospace;margin-top:2px}
.prompt-area{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.prompt-input{background:var(--card);border:1px solid var(--b);border-radius:4px;padding:10px 12px;color:var(--text);font-size:12px;font-family:'Space Grotesk',sans-serif;outline:none;width:100%;resize:none;height:72px;transition:border-color .2s}
.prompt-input:focus{border-color:var(--orange)}
.prompt-input::placeholder{color:var(--muted)}
.btn-row{display:flex;gap:8px}
.btn-run{background:var(--orange);border:none;border-radius:4px;padding:8px 20px;color:#000;font-size:12px;font-weight:600;cursor:pointer;font-family:'Space Grotesk',sans-serif;flex:1;transition:background .15s;letter-spacing:.02em}
.btn-run:hover{background:var(--orange2)}
.btn-clear{background:transparent;border:1px solid var(--b);border-radius:4px;padding:8px 16px;color:var(--muted);font-size:12px;cursor:pointer;font-family:'Space Grotesk',sans-serif;transition:all .15s}
.btn-clear:hover{border-color:var(--b2);color:var(--text)}

/* DOMAIN SECTIONS + SKILL BUTTONS */
.domain-sect{margin-bottom:20px}
.domain-label{font-size:10px;font-family:'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--muted);text-transform:uppercase;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.domain-label::after{content:'';flex:1;height:1px;background:var(--b)}
.skill-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.skill-btn{background:var(--card);border:1px solid var(--b);border-radius:5px;padding:9px 10px;font-size:11px;font-family:'JetBrains Mono',monospace;color:var(--text);cursor:pointer;transition:all .15s;text-align:left;position:relative;overflow:hidden;line-height:1.3}
.skill-btn::before{content:'';position:absolute;inset:0;background:var(--orange);opacity:0;transition:opacity .15s}
.skill-btn:hover{border-color:var(--b2);color:var(--orange)}
.skill-btn:hover::before{opacity:.04}
.skill-btn.active-skill{border-color:var(--orange);color:var(--orange);background:var(--orange-dim)}
.skill-btn .sk-type{font-size:8px;color:var(--dim);display:block;margin-bottom:2px;letter-spacing:.08em}
.skill-btn.routine .sk-type{color:var(--amber)}
.skill-btn.agent .sk-type{color:var(--purple)}
.skill-btn.auto .sk-type{color:var(--green)}

/* RIGHT PANEL CARDS */
.rp-card{background:var(--card);border:1px solid var(--b);border-radius:6px;padding:12px;margin-bottom:10px}
.rp-title{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
.stat-pair{display:flex;justify-content:space-between;align-items:center;padding:5px 0;border-bottom:1px solid var(--dim)}
.stat-pair:last-child{border-bottom:none}
.sp-label{font-size:11px;color:var(--muted)}
.sp-val{font-size:12px;font-family:'JetBrains Mono',monospace;font-weight:500}
.recent-run{display:flex;gap:8px;padding:5px 0;border-bottom:1px solid var(--dim);font-size:10px;align-items:flex-start}
.recent-run:last-child{border-bottom:none}
.rr-type{font-family:'JetBrains Mono',monospace;padding:1px 5px;border-radius:2px;font-size:9px;letter-spacing:.06em;flex-shrink:0;margin-top:1px}
.rr-type.created{background:rgba(76,175,125,.15);color:var(--green)}
.rr-type.updated{background:rgba(91,155,213,.15);color:var(--blue)}
.rr-type.deleted{background:rgba(224,82,82,.15);color:var(--red)}
.rr-name{color:var(--text);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rr-path{color:var(--muted);font-family:'JetBrains Mono',monospace;font-size:9px;display:block;margin-top:1px}
.rr-time{color:var(--dim);font-family:'JetBrains Mono',monospace;font-size:9px;flex-shrink:0}
.forecast-bar{height:8px;background:var(--dim);border-radius:2px;overflow:hidden;margin:6px 0;position:relative}
.fb-fill{height:100%;border-radius:2px}
.fb-fill.elapsed{background:var(--orange)}
.fb-fill.projected{background:rgba(232,98,42,.3);margin-left:0}
.forecast-meta{display:flex;justify-content:space-between;font-size:9px;font-family:'JetBrains Mono',monospace}
.bar-chart-mini{display:flex;align-items:flex-end;gap:3px;height:40px;margin-top:6px}
.bcm-bar{flex:1;background:var(--orange);border-radius:2px 2px 0 0;opacity:.7;transition:opacity .2s;cursor:default}
.bcm-bar:hover{opacity:1}
.bcm-labels{display:flex;justify-content:space-between;font-size:8px;color:var(--dim);font-family:'JetBrains Mono',monospace;margin-top:2px}
.output-area{background:var(--surface);border:1px solid var(--b);border-radius:4px;padding:12px;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);min-height:80px;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.6}
.output-line-g{color:var(--green)}
.output-line-o{color:var(--orange)}
.output-line-b{color:var(--blue)}
.output-line-a{color:var(--amber)}

/* TOAST */
#toast{position:fixed;bottom:20px;right:20px;z-index:999;display:flex;flex-direction:column;gap:6px}
.toast-item{background:var(--card);border:1px solid var(--b);border-left:3px solid var(--orange);border-radius:6px;padding:10px 14px;font-size:11px;animation:tin .3s ease;box-shadow:0 8px 24px rgba(0,0,0,.6)}
@keyframes tin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}

/* SCROLLBAR STYLING */
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--b2);border-radius:2px}

/* PIPELINE FLOW */
.pipeline{display:flex;gap:0;margin-bottom:12px}
.pl-stage{flex:1;padding:6px 8px;border:1px solid var(--b);border-right:none;text-align:center;cursor:pointer;transition:all .15s}
.pl-stage:first-child{border-radius:4px 0 0 4px}
.pl-stage:last-child{border-right:1px solid var(--b);border-radius:0 4px 4px 0}
.pl-stage:hover{background:var(--lift)}
.ps-label{font-size:9px;font-family:'JetBrains Mono',monospace;color:var(--muted);letter-spacing:.06em;display:block}
.ps-count{font-size:16px;font-weight:600;color:var(--text)}

/* REVENUE METER */
.mrr-bar{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.mrr-val{font-size:28px;font-weight:700;font-family:'JetBrains Mono',monospace;letter-spacing:-.03em;color:var(--orange)}
.mrr-target{font-size:11px;color:var(--muted)}
.mrr-track{flex:1;height:6px;background:var(--dim);border-radius:3px;overflow:hidden}
.mrr-fill{height:100%;background:linear-gradient(90deg,var(--orange),var(--amber));border-radius:3px}

/* LOADING SPINNER */
.spinner{width:12px;height:12px;border:1.5px solid var(--b2);border-top-color:var(--orange);border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0}
@keyframes spin{to{transform:rotate(360deg)}}

/* ACTIVE SKILL RUNNING */
.running-bar{background:var(--orange-dim);border:1px solid rgba(232,98,42,.3);border-radius:4px;padding:8px 12px;display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:11px}
.running-name{color:var(--orange);font-family:'JetBrains Mono',monospace;font-weight:500}
</style>
</head>
<body>
<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="logo">
      <div class="logo-icon">S</div>
      SUMMIT<span>OS</span>
    </div>
    <div class="topbar-center">
      <div class="tb-pill live"><span class="dot" style="background:var(--green)"></span>RAILWAY</div>
      <div class="tb-pill" id="vaultPill" onclick="nav('vault')"><span class="dot" style="background:var(--amber)"></span>VAULT</div>
      <div class="tb-pill" onclick="nav('brief')">MORNING BRIEF</div>
      <div class="tb-pill" onclick="nav('runs')">RUNS</div>
      <div class="tb-pill" onclick="nav('demos')">DEMOS</div>
    </div>
    <div class="tb-right">
      <span id="topStatus" style="color:var(--muted)">connecting...</span>
      <span id="topTime" style="color:var(--dim);margin-left:8px;font-size:10px"></span>
      <div class="idle-badge" id="idleBadge">● IDLE</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <div class="content" id="content"><!-- rendered by JS --></div>
    <div class="right-panel" id="rightPanel"><!-- rendered by JS --></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ═══════════════════════════════════════════════════════
// CONFIG
// ═══════════════════════════════════════════════════════
const API = 'https://ava-studio-api-production.up.railway.app';
const AVA_KEY = '101226ee5ba8047ffa4881bed74016e0';

// ═══════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════
let currentPage = 'main';
let activeSkill = null;
let apiOnline = false;
let runningJob = null;
let buildActive = false, buildStep = -1, buildDone = [];
let dispatchLog = [];

const BUILD_STEPS = [
  'Crawling website with Firecrawl',
  'Extracting brand identity + colors',
  'Analyzing services and content',
  'Generating personalized marketing audit',
  'Building optimized homepage HTML',
  'Deploying to Vercel subdomain',
  'Creating Voice AI receptionist (Thinker)',
  'Registering widget key',
  'Packaging shareable demo link',
  'Sending via GHL email + SMS'
];

// ═══════════════════════════════════════════════════════
// LIVE DATA (falls back to demo data if API offline)
// ═══════════════════════════════════════════════════════
let liveStats = {
  mrr: 4466, mrrTarget: 50000,
  leadsToday: 47, leadsCity: 'Milwaukee, WI', cityIndex: 26, citiesTotal: 365,
  emailsToday: 228, smsToday: 100,
  posReplies: 8, callsBooked: 3,
  demosBuilt: 12, websitesBuilt: 12, voiceAgents: 5,
  pipeline: [
    {stage:'Contacted',count:1820},{stage:'Replied',count:387},
    {stage:'Interested',count:142},{stage:'Demo Sent',count:89},
    {stage:'Booked',count:31},{stage:'Won',count:9}
  ],
  recentRuns: [
    {type:'created',name:'2026-05-01-peak-roofing-demo',path:'DEMOS/DEMOS',time:'3m'},
    {type:'updated',name:'2026-05-01-morning-brief',path:'PRODUCTIVITY/BRIEFS',time:'8m'},
    {type:'created',name:'2026-05-01-weekly-content',path:'CONTENT/SOCIAL',time:'42m'},
    {type:'updated',name:'PIPELINE-STATUS',path:'OPS/GHL',time:'1h'},
    {type:'created',name:'apollo-dallas-batch-26',path:'OUTREACH/SCRAPER',time:'2h'},
  ],
  sessionActivity: [28,35,19,42,67,54,38,71,89,62,77,83,59,94,76,88,101],
  weekActivity: [12,18,9,24,31,15,8],
  apiUsage: {window5h: 1.8, window5hMax: 5, windowWeekly: 28, windowWeeklyMax: 60, routines: 6, routinesMax: 15, cost: 12.40}
};

const SKILLS = {
  'OUTREACH': [
    {name:'Morning Brief',type:'routine',prompt:'Generate today\'s Summit Voice AI morning brief. Include: hot leads from last 24hrs, pipeline snapshot, demos built, calls booked, outreach stats, city progress, suggested actions for today.'},
    {name:'Apollo Scrape',type:'auto',prompt:'Trigger Apollo scraper for next city in sequence. Update city_index in state.json. Push new leads to GHL. Report: contacts found, emails valid, pushed to GHL.'},
    {name:'GHL Outreach',type:'auto',prompt:'Run GHL daily outreach batch — 100 contacts. Skip opted-out. Send email + SMS from templates. Tag sent contacts. Report stats.'},
    {name:'Reply Monitor',type:'auto',prompt:'Check GHL for new replies in last 15 minutes. Classify intent (positive/negative/nurture). Tag hot leads. Post to /ingest/replies. Alert Dan via Slack for positive replies.'},
    {name:'Follow-Up',type:'auto',prompt:'Run Day 3/7/14 follow-up sequences for contacts in outreach_tracker.db. Send appropriate follow-up based on day. Log results.'},
    {name:'Lead Enrich',type:'skill',prompt:'Enrich new GHL contacts: classify segment A-E, find Google review count, check for website, detect if running ads. Update custom fields.'},
    {name:'FB Ad Scout',type:'skill',prompt:'Scan Facebook Ad Library for roofing companies running ads in [city]. Extract company names, domains, ad details. Create GHL contacts tagged segment_c.'},
    {name:'LinkedIn Scout',type:'skill',prompt:'Search for roofing company owners on LinkedIn in [city, state]. Find owners/presidents/CEOs. Return names, companies, profile URLs for enrichment.'},
  ],
  'DEMO MACHINE': [
    {name:'Build Demo',type:'skill',prompt:'Build a complete demo for: [URL or company name]. Steps: Firecrawl scrape → brand extraction → homepage rebuild from GitHub template → Vercel deploy → Thinker voice agent → GHL delivery. Return demo URL.'},
    {name:'No-Website Build',type:'skill',prompt:'Build a demo for a company with NO website: [company name, city, state]. Generate homepage from scratch using vibe guide. Deploy. Create voice agent. Email prospect.'},
    {name:'Marketing Audit',type:'skill',prompt:'Generate a full marketing audit for: [company]. Score: call capture, speed-to-lead, review velocity, website conversion, after-hours coverage. Calculate revenue at risk ($1.56M-$8.67M formula). 450 words max.'},
    {name:'Demo Status',type:'skill',prompt:'Check status of all active demo builds. List: building, complete, failed. Show demo URLs for completed ones. Flag any that need retry.'},
    {name:'Rebuild Template',type:'skill',prompt:'Refresh the roofing homepage template from GitHub repos: Roofing-Template2, roofing-template-roofez, Roofing-Website-Template. Cache latest version locally.'},
    {name:'Voice Agent',type:'skill',prompt:'Create a Thinker voice AI agent for: [URL]. Log into THINKRR.ai. Select Web+Phone. Set voice to Marissa or Susan. Set web agent URL. Extract widget key. Return key.'},
    {name:'Batch Demos',type:'skill',prompt:'Build demos for all contacts tagged "audit requested" in GHL. Process up to 10 at a time. Report: built, failed, demo URLs.'},
    {name:'Demo Metrics',type:'skill',prompt:'Pull demo analytics: how many demos sent this week, open rate, reply rate, demo-to-call conversion. Compare to previous week. Suggest optimization.'},
  ],
  'CONTENT': [
    {name:'Weekly Content',type:'routine',prompt:'Generate this week\'s social content for Summit Voice AI. Pillar: [auto-rotate]. Platforms: LinkedIn, Facebook, Instagram, Twitter x2, TikTok. Voice: Alex Hormozi for trades. Return JSON. Save to vault CONTENT/SOCIAL/[date].md'},
    {name:'LinkedIn Post',type:'skill',prompt:'Write one LinkedIn post for Summit Voice AI. Hook → problem → insight → CTA. 150-250 words. Peer-to-peer roofing owner energy. Stat: [choose from: 67% calls unanswered, $9500 avg job, 3-5 missed calls/day]. No em dashes.'},
    {name:'TikTok Script',type:'skill',prompt:'Write a TikTok script for Dan Gill III at Summit Voice AI. 45-75 seconds. Raw, direct, from-the-roof energy. Open with most surprising stat. Include [PAUSE] [CUT] directions. Former roofer voice.'},
    {name:'Email Sequence',type:'skill',prompt:'Write a new cold email variant for roofing contractors. Segment: [A/B/C/D/E]. Hook: missed calls. Under 150 words. Lowercase subject. No em dashes. No product name on first touch.'},
    {name:'Case Study',type:'skill',prompt:'Draft a case study for a recent Summit Voice AI client win. Use: company type, city, revenue recovered, calls answered. 300 words. Real results, no fluff.'},
    {name:'Content Calendar',type:'skill',prompt:'Plan next 4 weeks of Summit Voice AI content. One theme per week. 5 posts per week across platforms. Return as table: date, platform, pillar, hook, CTA.'},
    {name:'X Pulse',type:'skill',prompt:'Scan Twitter/X for trending roofing industry topics + AI for contractors in last 48 hours. Find: what\'s hot, gaps, hook formats working. Return 3 post ideas. Save to vault RAW/X-PULSE/[date].md'},
    {name:'Schedule Posts',type:'auto',prompt:'Schedule this week\'s approved content posts to GHL Social Planner. Facebook: 9am Tuesday. Instagram: 11am Tuesday. LinkedIn: 8am Wednesday. Save scheduling confirmation to vault.'},
  ],
  'GHL + CRM': [
    {name:'Pipeline Snapshot',type:'skill',prompt:'Pull live GHL pipeline counts for SVA Cold Outreach Pipeline. Format as table: stage → count → change from yesterday. Flag any stages that are stuck. Save to vault OPS/GHL/pipeline-[date].md'},

  ${[['GHL API','operational','green'],['Apollo','operational','green'],['Railway','operational','green'],['Vercel','operational','green'],['Thinker','needs setup','amber'],['Vault','needs setup','amber'],['Slack','needs setup','red']].map(([n,s,c]) => `
  <div class="stat-pair">
    <span class="sp-label" style="font-size:10px">${n}</span>
    <span style="font-size:9px;color:var(--${c});font-family:JetBrains Mono,monospace">${s}</span>
  </div>`).join('')}
</div>`;
}

// ═══════════════════════════════════════════════════════
// ACTIONS
// ═══════════════════════════════════════════════════════
function nav(page) {
  currentPage = page;
  render();
}

function loadSkill(name, type) {
  activeSkill = name;
  // Find the skill prompt
  let prompt = '';
  for (const [domain, skills] of Object.entries(SKILLS)) {
    const sk = skills.find(s => s.name === name);
    if (sk) { prompt = sk.prompt; break; }
  }
  const inp = document.getElementById('promptInput');
  if (inp) inp.value = prompt;
  toast(`Skill loaded: ${name}`);
  // Scroll to prompt
  inp && inp.scrollIntoView({behavior:'smooth',block:'center'});
  render();
}

function loadCmd(cmd) {
  const inp = document.getElementById('promptInput');
  if (inp) inp.value = cmd;
  inp && inp.focus();
}

async function runPrompt() {
  const inp = document.getElementById('promptInput');
  const cmd = inp ? inp.value.trim() : '';
  if (!cmd) return;

  const lower = cmd.toLowerCase();
  runningJob = {skill: activeSkill || 'Custom Command', step: 'Processing...'};
  document.getElementById('idleBadge').textContent = '⟳ RUNNING';
  document.getElementById('idleBadge').style.color = 'var(--orange)';

  // Route to appropriate handler
  if (lower.includes('build') || lower.includes('demo')) {
    const urlMatch = cmd.match(/https?:\/\/[^\s]+|[\w-]+\.(com|net|org|io)/);
    if (urlMatch) {
      inp.value = '';
      startBuild(urlMatch[0]);
      return;
    }
  }

  if (lower.startsWith('demo ') || lower.includes('generate demo')) {
    const url = cmd.split(' ').find(w => w.includes('.'));
    if (url) { startBuild(url); inp.value = ''; return; }
  }

  // API dispatch
  if (apiOnline) {
    const r = await apiFetch('/dispatch', {
      method:'POST',
      body:JSON.stringify({command:cmd.split(' ')[0],url:cmd.split(' ')[1]||'',company:cmd.split(' ').slice(1).join(' ')})
    });
    addLog('g', `> ${cmd}`);
    addLog('b', `→ ${r ? JSON.stringify(r) : 'Command queued'}`);
  } else {
    addLog('g', `> ${cmd}`);
    addLog('a', `→ [offline mode] Command logged locally`);
  }

  runningJob = null;
  document.getElementById('idleBadge').textContent = '● IDLE';
  document.getElementById('idleBadge').style.color = '';
  inp.value = '';
  render();
}

function clearPrompt() {
  const inp = document.getElementById('promptInput');
  if (inp) inp.value = '';
  activeSkill = null;
  render();
}

function addLog(type, msg) {
  dispatchLog.unshift({t:type,m:msg});
  if (dispatchLog.length > 12) dispatchLog.pop();
}

// Demo build simulation
let buildTimer;
function startBuild(url) {
  if (buildActive) { toast('Build already in progress'); return; }
  url = url || (document.getElementById('demoUrl') ? document.getElementById('demoUrl').value : 'demo.com');
  buildActive = true; buildStep = 0; buildDone = [];
  currentPage = 'demos';
  runningJob = {skill:'Demo Machine',step:'Starting...'};
  addLog('o', `> Building demo for ${url}`);
  render();
  const dur = [1200,900,700,1100,1300,800,1400,600,500,600];
  const run = i => {
    if (i >= BUILD_STEPS.length) {
      buildActive = false; buildStep = BUILD_STEPS.length;
      runningJob = null;
      document.getElementById('idleBadge').textContent = '● IDLE';
      addLog('g', `✓ Demo live: summit-demo-${url.replace(/[^a-z0-9]/gi,'-').slice(0,20)}.vercel.app`);
      toast('✅ Demo is live!');
      render(); return;
    }
    buildStep = i; buildDone.push(i);
    if (runningJob) runningJob.step = `Step ${i+1}/10: ${BUILD_STEPS[i]}`;
    render();
    buildTimer = setTimeout(() => run(i+1), dur[i]||700);
  };
  buildTimer = setTimeout(() => run(0), 500);
}

// ═══════════════════════════════════════════════════════
// API
// ═══════════════════════════════════════════════════════
async function apiFetch(path, opts={}) {
  try {
    const r = await fetch(API+path, {headers:{'Content-Type':'application/json','X-API-Key':AVA_KEY},...opts});
    if (!r.ok) throw new Error(r.status);
    return await r.json();
  } catch { return null; }
}

async function checkHealth() {
  const r = await apiFetch('/health');
  apiOnline = !!r;
  const el = document.getElementById('topStatus');
  if (el) {
    el.textContent = r ? '● LIVE — all systems' : '○ API offline — local mode';
    el.style.color = r ? 'var(--green)' : 'var(--amber)';
  }
  // Refresh live stats if online
  if (r) {
    const summary = await apiFetch('/analytics/summary');
    if (summary) {
      Object.assign(liveStats, {
        mrr: summary.mrr || liveStats.mrr,
        leadsToday: summary.leadsToday || liveStats.leadsToday,
        posReplies: summary.posReplies || liveStats.posReplies,
        callsBooked: summary.callsBooked || liveStats.callsBooked,
        demosBuilt: summary.demosBuilt || liveStats.demosBuilt,
      });
    }
    const hotLeads = await apiFetch('/outreach/hot-leads?limit=5');
    if (hotLeads && hotLeads.length) {
      liveStats.recentRuns = hotLeads.slice(0,5).map(l => ({
        type:'created', name:l.company+' — '+l.message?.slice(0,30), path:'OUTREACH/HOT-LEADS', time:'just now'
      }));
    }
  }
  if (currentPage === 'main' || currentPage === 'brief') render();
}

// ═══════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════
function toast(msg, type='info') {
  const c = document.getElementById('toast');
  const el = document.createElement('div');
  el.className = 'toast-item';
  el.style.borderLeftColor = type==='error'?'var(--red)':type==='success'?'var(--green)':'var(--orange)';
  el.textContent = msg;
  c.appendChild(el);
  setTimeout(() => { el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(()=>el.remove(),300); }, 4000);
}

function copyText(t) {
  navigator.clipboard.writeText('https://'+t).then(()=>toast('Copied: https://'+t)).catch(()=>toast('Link: https://'+t));
}

// ═══════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════
function render() {
  const pages = { main:renderMain, vault:renderVault, brief:renderBrief, runs:renderRuns, demos:renderDemos };
  document.getElementById('content').innerHTML = (pages[currentPage]||renderMain)();
  document.getElementById('rightPanel').innerHTML = renderRight();

  // Update vault pill
  const vp = document.getElementById('vaultPill');
  if (vp) vp.style.borderColor = currentPage==='vault' ? 'var(--orange)' : 'var(--b)';
}

// Time display
setInterval(() => {
  const el = document.getElementById('topTime');
  if (el) el.textContent = new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',hour12:true});
}, 1000);

// Global search / command
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') clearPrompt();
  if ((e.metaKey||e.ctrlKey) && e.key==='k') {
    e.preventDefault();
    const inp = document.getElementById('promptInput');
    if (inp) { inp.focus(); inp.select(); }
  }
});

// ═══════════════════════════════════════════════════════
// AUTH GATE
// ═══════════════════════════════════════════════════════
const _AP = 'summit2026';
function _ca() {
  if (sessionStorage.getItem('_sa') === '1') return true;
  const p = prompt('Summit OS — Enter password:');
  if (p === _AP) { sessionStorage.setItem('_sa', '1'); return true; }
  if (p !== null) alert('Incorrect password');
  return false;
}

// ═══════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════
async function init() {
  render();
  await checkHealth();
  render();
  setInterval(checkHealth, 30000);
}

if (_ca()) {
  init();
} else {
  const denied = document.createElement('div');
  denied.style.cssText = 'display:flex;align-items:center;justify-content:center;height:100vh;background:#0a0a08;color:#6B6B64;font-family:monospace;font-size:12px';
  denied.textContent = 'access denied · refresh to retry';
  document.body.replaceChildren(denied);
}
</script>
</body>
